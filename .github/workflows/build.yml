name: Build CSP docs

on:
  schedule:
    # Weekly on Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-csp-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: state
          key: csp-scraper-state-v1

      - name: Restore previous output from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output state/policy-ddf/extracted
          if gh release download latest --pattern csp-docs.zip --dir /tmp --clobber 2>/dev/null; then
            echo "Restoring pages/ from prior csp-docs.zip"
            unzip -o /tmp/csp-docs.zip -d /tmp/prior-csp > /dev/null
            if [ -d /tmp/prior-csp/pages ]; then
              cp /tmp/prior-csp/pages/*.md output/ 2>/dev/null || true
            fi
          else
            echo "No prior csp-docs.zip — starting cold."
          fi
          if gh release download latest --pattern policy-ddf.zip --dir /tmp --clobber 2>/dev/null; then
            echo "Restoring extracted XML from prior policy-ddf.zip"
            unzip -o /tmp/policy-ddf.zip -d /tmp/prior-ddf > /dev/null
            if [ -d /tmp/prior-ddf/extracted ]; then
              cp /tmp/prior-ddf/extracted/*.xml state/policy-ddf/extracted/ 2>/dev/null || true
            fi
          else
            echo "No prior policy-ddf.zip — starting cold."
          fi

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Summarize
        id: summary
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("state/manifest.json", "utf8"));
            const c = m.counts;
            let ddf = "no policy-ddf artifact";
            try {
              const s = JSON.parse(fs.readFileSync("state/policy-ddf/state.json", "utf8"));
              const fname = (s.discoveredUrl || "").split("/").pop();
              const mb = s.sourceBytes ? (s.sourceBytes/1024/1024).toFixed(2) : "?";
              ddf = `policy-ddf: ${s.xmlCount ?? "?"} XML files (source ${fname}, ${mb} MB)`;
            } catch {}
            const line = `Built ${new Date().toISOString().slice(0,10)}. csp-docs: ${c.total} pages (${c.updated} updated, ${c.notModified} unchanged, ${c.missing} missing, ${c.errors} errors). ${ddf}.`;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `notes=${line}\n`);
            console.log(line);
          '

      - name: Replace "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          ASSETS="dist/csp-docs.zip"
          if [ -f dist/policy-ddf.zip ]; then
            ASSETS="$ASSETS dist/policy-ddf.zip"
          fi
          gh release create latest $ASSETS \
            --title "Latest CSP Docs" \
            --notes "${{ steps.summary.outputs.notes }}"
